# 临时诊断工作流 2: 决定性验证 v143 Debug CRT 缺失假设
# 用当前工具集编译 /MDd 最小程序并运行; 失败则补装组件后重试
name: debug-crt2
on: workflow_dispatch
permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Decisive test
        shell: pwsh
        run: |
          Write-Host "VCToolsVersion : $env:VCToolsVersion"
          Write-Host "VCToolsRedistDir: $env:VCToolsRedistDir"
          $vs = (& 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -latest -products * -property installationPath)

          # 1) 镜像上已有的 x64 DebugCRT 目录
          Get-ChildItem (Join-Path $vs 'VC\Redist\MSVC') -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $d = Join-Path $_.FullName 'debug_nonredist\x64'
            if (Test-Path $d) { Write-Host "X64 DebugCRT dir: $d"; Get-ChildItem $d -Recurse -Filter *.dll | ForEach-Object { Write-Host "   $($_.Name)" } }
          }

          # 2) System32 里六个 DLL 的版本
          foreach ($f in 'vcruntime140d.dll','vcruntime140_1d.dll','msvcp140d.dll','msvcp140_1d.dll','msvcp140_2d.dll','ucrtbased.dll') {
            $p = "C:\Windows\System32\$f"
            if (Test-Path $p) { Write-Host "SYS32 $f -> $((Get-Item $p).VersionInfo.FileVersion)" }
            else { Write-Host "SYS32 $f -> MISSING" }
          }

          # 3) 决定性测试: 用当前工具集编译 /MDd 程序并运行
          Set-Content -Path t.cpp -Value 'int main(){return 0;}' -Encoding ascii
          & cl.exe /nologo /MDd /EHsc /Fe:t.exe t.cpp 2>&1 | Select-Object -Last 1
          if (Test-Path t.exe) {
            & .\t.exe
            Write-Host "MDd-test exit: $LASTEXITCODE (0=运行时OK, 其他=缺DLL)"
            & dumpbin /dependents t.exe 2>&1 | Select-String '\.dll' | ForEach-Object { Write-Host "DEP $($_.Line.Trim())" }
          } else { Write-Host "MDd-test: 编译失败" }

          # 4) 失败则补装 v142 运行时组件 (会连带装 v143 DebugCRT), 再重试
          if (Test-Path t.exe) {
            & .\t.exe; $first = $LASTEXITCODE
            if ($first -ne 0) {
              $setup = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe'
              Write-Host '=== 补装组件 ==='
              & $setup modify --installPath $vs --add Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64 --quiet --norestart --wait
              Write-Host "setup exit: $LASTEXITCODE"
              Get-ChildItem (Join-Path $vs 'VC\Redist\MSVC') -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                $d = Join-Path $_.FullName 'debug_nonredist\x64'
                if (Test-Path $d) { Write-Host "AFTER X64 DebugCRT dir: $d"; Get-ChildItem $d -Recurse -Filter *.dll | ForEach-Object { Write-Host "   $($_.Name)" } }
              }
              & .\t.exe
              Write-Host "MDd-test-after-install exit: $LASTEXITCODE"
            }
          }
