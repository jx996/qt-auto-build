# 临时诊断工作流: 在 windows-2022 上验证"补装 VC Debug 运行时"方案
# 完成后会删除本文件
name: debug-crt
on: workflow_dispatch
permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Probe and install VC debug CRT
        shell: pwsh
        run: |
          $vs = (& 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -latest -products * -property installationPath)
          Write-Host "VS install path: $vs"
          Write-Host "setup.exe exists: $(Test-Path 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe')"

          # 1) System32 里三个 DLL 的架构 (验证为何不能用)
          foreach ($f in 'C:\Windows\System32\vcruntime140d.dll','C:\Windows\System32\msvcp140d.dll','C:\Windows\System32\ucrtbased.dll') {
            if (Test-Path $f) {
              $m = & dumpbin /headers $f 2>&1 | Select-String 'machine' | Select-Object -First 1
              Write-Host "System32 $f => $($m.Line.Trim())"
            } else { Write-Host "System32 $f => MISSING" }
          }

          # 2) 从已安装实例的 catalog.json 里找 CRT/DebugCRT 组件 ID
          $inst = Get-ChildItem 'C:\ProgramData\Microsoft\VisualStudio\Packages\_Instances' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($inst) {
            $cat = Join-Path $inst.FullName 'catalog.json'
            Write-Host "catalog: $cat (exists=$(Test-Path $cat))"
            if (Test-Path $cat) {
              $content = Get-Content $cat -Raw
              [regex]::Matches($content, '"id"\s*:\s*"([^"]*(?:DebugCRT|VC\.14\.29|VC\.14\.3|VC\.14\.4)[^"]*)"') | ForEach-Object {
                Write-Host "CATALOG component: $($_.Groups[1].Value)"
              } | Select-Object -Unique
            }
          }

          # 3) 补装 v142 x86/x64 CRT 组件 (含 debug_nonredist x64)
          $setup = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe'
          Write-Host "=== setup.exe modify --add Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64 ==="
          & $setup modify --installPath $vs --add Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64 --quiet --norestart --wait
          Write-Host "setup exit code: $LASTEXITCODE"

          # 4) 补装后重新搜索三个 x64 Debug DLL
          Write-Host "=== after-install search ==="
          foreach ($root in "$vs\VC\Redist\MSVC", "$vs\VC\Tools\MSVC", 'C:\Program Files (x86)\Windows Kits\10\bin') {
            if (-not (Test-Path $root)) { continue }
            Get-ChildItem $root -Recurse -Include vcruntime140d.dll,msvcp140d.dll,ucrtbased.dll -File -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "FOUND $($_.Name) -> $($_.DirectoryName)"
            }
          }
