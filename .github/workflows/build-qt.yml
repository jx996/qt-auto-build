# =============================================================================
# build-qt.yml —— 从源码自动化编译 / 打包 / 发布 Qt（仅开源组件）
#
# 功能:
#   - 使用 VS2022 x64 与 VS2026 x64 两个工具链矩阵并行编译
#   - 生成 shared (动态链接) 的 Release + Debug 两个配置
#   - 仅构建开源协议组件: qtbase / qttools / qttranslations / qtsvg
#   - 7z 打包, 生成 SHA256 校验和, 上传 Artifact 并发布到 GitHub Releases
#
# 触发方式:
#   - 手动触发 (workflow_dispatch): 可指定 Qt 版本
#   - 自动触发 (workflow_call): 由 check-qt-updates 检测到新版本时调用
#   - 如需 push/tag 自动触发, 取消下方注释并调整策略
# =============================================================================

name: build-qt

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt 版本号 (需为 qt.io 官方已发布版本, 留空使用默认值)'
        required: true
        default: '6.8.4'
      publish_release:
        description: '构建完成后是否发布 GitHub Release'
        type: boolean
        default: true
  workflow_call:
    inputs:
      qt_version:
        description: 'Qt 版本号 (需为 qt.io 官方已发布版本)'
        type: string
        required: true
      publish_release:
        description: '构建完成后是否发布 GitHub Release'
        type: boolean
        default: true
# on:
#   push:
#     branches: [ main ]
#     tags: [ 'qt-*' ]
#   workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: ${{ inputs.qt_version || '6.8.4' }}
  # 链接方式: shared=动态链接库 / static=静态链接库 (用于包名与发布标识)
  LINK_TYPE: shared

jobs:
  build-windows:
    # 注意: env 上下文不可用于 job 级 name 字段, 需用 inputs/matrix 上下文
    name: Qt ${{ inputs.qt_version || '6.8.4' }} - ${{ matrix.vs_label }} x64 (Release+Debug)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: msvc2022
            vs_label: MSVC2022
            runner: windows-2022
          - id: msvc2026
            vs_label: MSVC2026
            # windows-latest 目前内置 Visual Studio 2026 (v18.x);
            # 待官方 windows-2026 稳定镜像发布后可直接改为 windows-2026
            runner: windows-latest
            # Qt5 (5.x) 官方支持到 MSVC2019/2022, VS2026 下自动跳过该工具链
            if: ${{ !startsWith(inputs.qt_version || '6.8.4', '5.') }}

    steps:
      # 1. 检出本仓库 (包含 scripts/ 与 config/)
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Python: Qt 构建过程需要
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: 'x64'

      # 3. MSVC 环境: 直接调用 VsDevCmd.bat 并导入环境
      #    (替代第三方 action, 避免 Node 20 弃用警告)
      - name: Setup MSVC environment (VsDevCmd)
        shell: pwsh
        run: |
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -property installationPath | Select-Object -First 1
          if (-not $vs) { throw 'vswhere 未找到 VS 安装' }
          $devCmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $devCmd)) { throw "缺少 VsDevCmd.bat: $devCmd" }
          Write-Host "VsDevCmd: $devCmd"
          $lines = cmd /c "`"$devCmd`" -arch=amd64 -host_arch=amd64 && set"
          if ($LASTEXITCODE -ne 0) { throw 'VsDevCmd 执行失败' }
          $envFile = $env:GITHUB_ENV
          foreach ($line in $lines) {
            $line = $line.TrimEnd("`r")
            if ($line -match '^([^=]+)=(.*)$') {
              $k = $matches[1]; $v = $matches[2]
              [Environment]::SetEnvironmentVariable($k, $v, 'Process')
              if ($envFile) {
                $d = 'GHENV' + [guid]::NewGuid().ToString('N')
                "$k<<$d`n$v`n$d" | Out-File -FilePath $envFile -Append -Encoding utf8
              }
            }
          }
          Write-Host "cl.exe: $((Get-Command cl).Source)"

      # 4. 下载固定版本的 CMake / Ninja 并加入 PATH (不依赖 runner 镜像自带版本)
      - name: Init toolchain
        shell: pwsh
        run: ./scripts/init-tools.ps1 -ToolsDir "${{ runner.temp }}\tools"

      # 5. 下载 4 个开源组件的源码并解压 (qtbase/qttools/qttranslations/qtsvg)
      - name: Download Qt sources (open-source components only)
        shell: pwsh
        run: |
          ./scripts/download-sources.ps1 `
            -QtVersion "${{ env.QT_VERSION }}" `
            -WorkDir "${{ runner.temp }}\qt" `
            -ToolsDir "${{ runner.temp }}\tools"

      # 6. 编译 + 安装 (Release 与 Debug 双配置, shared 链接)
      - name: Build Qt (Release + Debug)
        shell: pwsh
        run: |
          ./scripts/build-qt.ps1 `
            -QtVersion "${{ env.QT_VERSION }}" `
            -Toolchain "${{ matrix.id }}" `
            -WorkDir "${{ runner.temp }}\qt" `
            -ToolsDir "${{ runner.temp }}\tools"

      # 7. 打包: 7z 压缩 + SHA256 校验和 + 版本说明 + 许可协议
      - name: Package binaries
        shell: pwsh
        run: |
          ./scripts/package.ps1 `
            -QtVersion "${{ env.QT_VERSION }}" `
            -Toolchain "${{ matrix.id }}" `
            -WorkDir "${{ runner.temp }}\qt" `
            -DistDir "dist" `
            -LinkType "${{ env.LINK_TYPE }}"

      # 8. 上传构建产物 (Artifact) —— 发布由下方独立的 release job 汇总
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Qt-${{ env.QT_VERSION }}-${{ matrix.id }}-x64-${{ env.LINK_TYPE }}-Release-Debug
          path: dist/*.7z
          if-no-files-found: error

  # ===========================================================================
  # release —— 汇总两个工具链的包, 在同一个 tag 下发布 (一个版本一个 Release)
  # ===========================================================================
  release:
    # 注意: env 上下文不可用于 job 级 name, 用 inputs
    name: 发布 Qt ${{ inputs.qt_version || '6.8.4' }} (一个 tag 汇总两个工具链)
    needs: build-windows
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. 下载两个工具链构建的全部产物 (合并到 artifacts/)
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: Qt-*
          path: artifacts
          merge-multiple: true

      # 2. 幂等清理: 同名 tag/Release 已存在时先删除, 保证同一版本可重复发布
      - name: Cleanup same-name release/tag (idempotent re-run)
        shell: pwsh
        run: |
          $tag = "Qt-${{ env.QT_VERSION }}-x64-${{ env.LINK_TYPE }}-Release-Debug"
          $api = "https://api.github.com/repos/${{ github.repository }}"
          $rel = curl -s -H "Authorization: Bearer ${{ github.token }}" "$api/releases/tags/$tag" | ConvertFrom-Json
          if ($rel.id) {
            curl -s -X DELETE -H "Authorization: Bearer ${{ github.token }}" "$api/releases/$($rel.id)" | Out-Null
            Write-Host "已删除同名 Release: $tag"
          }
          $ref = curl -s -H "Authorization: Bearer ${{ github.token }}" "$api/git/refs/tags/$tag" | ConvertFrom-Json
          if ($ref.ref) {
            curl -s -X DELETE -H "Authorization: Bearer ${{ github.token }}" "$api/git/refs/tags/$tag" | Out-Null
            Write-Host "已删除同名 Tag: $tag"
          }

      # 3. 发布: 一个 tag, 两个工具链的包 + 校验和 (softprops v3 = node24, 无弃用警告)
      - name: Publish GitHub Release (single tag)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Qt-${{ env.QT_VERSION }}-x64-${{ env.LINK_TYPE }}-Release-Debug
          name: Qt ${{ env.QT_VERSION }} (${{ env.LINK_TYPE }}, x64, Release + Debug, 开源组件)
          body: |
            ## 构建信息
            - Qt 版本: ${{ env.QT_VERSION }}
            - 链接方式: ${{ env.LINK_TYPE }} (shared=动态链接)
            - 工具链: MSVC2022 x64 + MSVC2026 x64 (两个包在同一 tag 下)
            - 配置: Release + Debug
            - 组件: qtbase / qttools / qttranslations / qtsvg (仅开源协议组件, LGPL-3.0/GPL-3.0)
            - 构建日期: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            - 提交: ${{ github.sha }}

            包名: Qt-<版本>-msvc2022-x64-${{ env.LINK_TYPE }}-Release-Debug.7z / Qt-<版本>-msvc2026-x64-${{ env.LINK_TYPE }}-Release-Debug.7z
            压缩包内含 version-info.txt 与 licenses/ (LGPL/GPL 许可全文 + 商用合规说明)。
            详细说明见仓库 README.md。压缩包内附 SHA256 校验和文件。
          files: |
            artifacts/**/*.7z
            artifacts/**/*.sha256.txt
