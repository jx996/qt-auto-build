# =============================================================================
# check-qt-updates.yml —— 检测多条 Qt 版本线是否有新补丁, 有则自动编译打包发布
#
# 监控队列 (逗号分隔的版本线列表, 优先级):
#   1. workflow_dispatch 输入 qt_minors  (手动运行时填写)
#   2. 仓库变量 QT_MINORS              (Settings -> Secrets and variables -> Actions
#                                       -> Variables 新建, 无需改 workflow)
#   3. 默认值                            (本文件 default)
#
# 原理:
#   1. 对队列中每条版本线, 抓取 qt.io 官方源 <版本线>/ 目录解析最新补丁版本;
#   2. 查询本仓库已发布的 Release tag (Qt-<版本>-x64-shared-Release-Debug,
#      一个 tag 含两个工具链的包), 存在即视为该版本已构建完成;
#   3. 官方最新 > 已构建完成 的版本收集为 JSON 数组, 经动态矩阵 + workflow_call
#      并行调用 build-qt.yml 自动完成编译 / 打包 / 发布;
#   4. 检测到新版本时推送钉钉通知 (地址由 Secret DINGTALK_WEBHOOK 控制, 未配置则跳过)。
#
# 触发:
#   - push: 每次推送 main 分支后自动检查
#   - schedule: 每天 02:00 UTC (北京时间 10:00) 自动检查
#   - workflow_dispatch: 手动运行, 可指定监控版本线队列
# =============================================================================

name: check-qt-updates

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      qt_minors:
        description: '监控的 Qt 版本线队列, 逗号分隔 (如 6.8,6.11); 留空用仓库变量 QT_MINORS 或默认值'
        type: string
        default: '6.8, 6.11'

# 注意: 可复用工作流 (build-qt.yml) 的权限受调用方限制,
# 其发布步骤需要 contents: write, 因此这里必须声明 write 而非 read
permissions:
  contents: write

jobs:
  check:
    name: 检查 Qt 各版本线新版本
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.collect.outputs.versions }}
    steps:
      - name: 收集需要构建的版本
        id: collect
        run: |
          # 监控队列: 输入 > 仓库变量 > 默认值
          QUEUE="${{ inputs.qt_minors || vars.QT_MINORS || '6.8, 6.11' }}"
          echo "监控队列: $QUEUE"
          TAGS=$(curl -s \
                 -H "Authorization: Bearer ${{ github.token }}" \
                 "https://api.github.com/repos/${{ github.repository }}/tags?per_page=100")

          NEED_BUILD=()
          IFS=',' read -ra LINES <<< "$QUEUE"
          for M in "${LINES[@]}"; do
            M=$(echo "$M" | xargs)          # 去除首尾空白
            [ -z "$M" ] && continue
            ESC=$(printf '%s' "$M" | sed 's/\./\\./g')

            # 官方最新补丁版本 (Qt6 在 official_releases, Qt5 在 archive, 依次回退)
            LATEST=$(curl -s "https://download.qt.io/official_releases/qt/$M/" \
                     | grep -oE "${ESC}\.[0-9]+" | sort -V | tail -1)
            if [ -z "$LATEST" ]; then
              LATEST=$(curl -s "https://download.qt.io/archive/qt/$M/" \
                       | grep -oE "${ESC}\.[0-9]+" | sort -V | tail -1)
            fi
            if [ -z "$LATEST" ]; then
              echo "::warning::无法从 qt.io 获取 $M 线最新版本, 跳过该线"
              continue
            fi

            # 已构建完成的版本 (tag: Qt-<版本>-x64-shared-Release-Debug)
            BUILT=$(printf '%s' "$TAGS" \
                    | grep -oE "Qt-${ESC}\.[0-9]+-x64-shared-Release-Debug" \
                    | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | sort -V | tail -1)

            echo "==> 版本线 $M: 官方最新=$LATEST, 已构建=${BUILT:-none}"
            if [ -z "$BUILT" ] || [ "$LATEST" != "$BUILT" ]; then
              NEED_BUILD+=("$LATEST")
            fi
          done

          if [ ${#NEED_BUILD[@]} -eq 0 ]; then
            echo "各版本线均无新版本, 本次不触发构建"
            echo "versions=[]" >> "$GITHUB_OUTPUT"
          else
            # 转为 JSON 数组供动态矩阵使用
            JSON=$(printf '%s\n' "${NEED_BUILD[@]}" \
                   | python3 -c "import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
            echo "versions=$JSON" >> "$GITHUB_OUTPUT"
            echo "待构建版本: $JSON"
          fi

      # 检测到新版本时推送钉钉通知 (未配置 DINGTALK_WEBHOOK 则跳过; 通知失败不阻断构建)
      - name: '钉钉通知: 检测到 Qt 新版本'
        if: steps.collect.outputs.versions != '' && steps.collect.outputs.versions != '[]'
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "未配置 DINGTALK_WEBHOOK, 跳过钉钉通知"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(python3 -c 'import json,sys; print(json.dumps({"msgtype":"text","text":{"content":"Qt 新版本检测: " + ", ".join(json.loads(sys.argv[1])) + "\n已自动触发构建: " + sys.argv[2]}}))' \
                    '${{ steps.collect.outputs.versions }}' "$RUN_URL")
          curl -s -X POST "$WEBHOOK" -H 'Content-Type: application/json' -d "$PAYLOAD"

  build:
    name: 构建 Qt ${{ matrix.version }} (自动)
    needs: check
    # 有需要构建的版本才触发 (versions 为 JSON 数组)
    if: needs.check.outputs.versions != '' && needs.check.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.check.outputs.versions) }}
    uses: ./.github/workflows/build-qt.yml
    # 可复用工作流默认不继承 secrets, 仅显式传递钉钉通知所需的这一个
    secrets:
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
    with:
      qt_version: ${{ matrix.version }}
